name: Flutter quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Create CI-only Firebase configuration
        shell: bash
        run: |
          mkdir -p lib/core/config
          printf '%s\n' \
            "import 'package:firebase_core/firebase_core.dart';" \
            "" \
            "class DefaultFirebaseOptions {" \
            "  const DefaultFirebaseOptions._();" \
            "" \
            "  static const FirebaseOptions currentPlatform = FirebaseOptions(" \
            "    apiKey: 'ci-placeholder'," \
            "    appId: '1:000000000000:web:ci-placeholder'," \
            "    messagingSenderId: '000000000000'," \
            "    projectId: 'ci-placeholder'," \
            "  );" \
            "}" \
            > lib/core/config/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

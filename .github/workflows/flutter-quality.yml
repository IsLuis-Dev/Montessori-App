name: Flutter quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified Flutter SDK
        shell: bash
        env:
          FLUTTER_ARCHIVE: flutter_linux_3.44.0-stable.tar.xz
          FLUTTER_SHA256: e1ec95e6c550458a34de93580cb85dac24da0e9bedb9bb42811f050ac5a0c7d5
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$FLUTTER_ARCHIVE" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$FLUTTER_ARCHIVE"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$FLUTTER_ARCHIVE" | sha256sum --check --strict
          tar --extract --xz --no-same-owner \
            --file "$RUNNER_TEMP/$FLUTTER_ARCHIVE" \
            --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Create CI-only Firebase configuration
        shell: bash
        run: |
          mkdir -p lib/core/config android/app/src/debug
          printf '%s\n' \
            "import 'package:firebase_core/firebase_core.dart';" \
            "" \
            "class DefaultFirebaseOptions {" \
            "  const DefaultFirebaseOptions._();" \
            "" \
            "  static const FirebaseOptions currentPlatform = FirebaseOptions(" \
            "    apiKey: 'ci-placeholder'," \
            "    appId: '1:000000000000:web:ci-placeholder'," \
            "    messagingSenderId: '000000000000'," \
            "    projectId: 'ci-placeholder'," \
            "  );" \
            "}" \
            > lib/core/config/firebase_options.dart
          printf '%s\n' \
            '{' \
            '  "project_info": {' \
            '    "project_number": "000000000000",' \
            '    "project_id": "ci-placeholder",' \
            '    "storage_bucket": "ci-placeholder.appspot.com"' \
            '  },' \
            '  "client": [' \
            '    {' \
            '      "client_info": {' \
            '        "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",' \
            '        "android_client_info": {' \
            '          "package_name": "com.example.prototipo_2"' \
            '        }' \
            '      },' \
            '      "oauth_client": [],' \
            '      "api_key": [' \
            '        {' \
            '          "current_key": "ci-placeholder"' \
            '        }' \
            '      ],' \
            '      "services": {' \
            '        "appinvite_service": {' \
            '          "other_platform_oauth_client": []' \
            '        }' \
            '      }' \
            '    }' \
            '  ],' \
            '  "configuration_version": "1"' \
            '}' \
            > android/app/src/debug/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

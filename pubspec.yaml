name: cintli_montessori
description: 'Aplicación móvil y panel web para la gestión escolar de Cintli Montessori.'
publish_to: 'none'

# Versión pública y número interno de la aplicación móvil.
version: 0.9.0+1

# Versión independiente del panel administrativo web.
admin_web_version: 0.7.0+1

environment:
  sdk: ^3.7.2

dependencies:
  cloud_firestore: ^6.9.0
  connectivity_plus: ^7.3.1
  firebase_app_check: ^0.4.7
  firebase_auth: ^6.6.1
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.3.0
  firebase_database: ^12.5.0
  firebase_storage: ^13.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  intl: ^0.20.3
  lucide_flutter: ^1.42.0
  package_info_plus: ^10.2.1
  provider: ^6.1.4
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  table_calendar: ^3.2.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # El panel lee su versión independiente durante el arranque.
    - pubspec.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'lib/assets/icons/play_store_512.png'
  adaptive_icon_foreground: 'lib/assets/icons/play_store_512.png'
